services:
  gw2-companion:
    image: ghcr.io/antastico/gw2-companion:aurora-dependency-depth
    container_name: gw2-companion

    environment:
      GW2_API_KEY: ${GW2_API_KEY:?GW2_API_KEY must be set}

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    restart: unless-stopped
